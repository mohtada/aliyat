<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آليات المكتب الخاص</title>
<meta name="theme-color" content="#1f3a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الآليات">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --top:#1f3a4f; --bottom:#ffffff; --ink:#15212b; --muted:#5b6975; }
  @media (prefers-color-scheme: dark) { :root { --bottom:#162029; --ink:#e6ecf1; --muted:#95a5b2; } }
  html, body { margin:0; height:100%; background:var(--bottom); overflow:hidden; }
  body { font-family:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif; color:var(--ink); }
  /* شريط الساعة فوق بلون رأس النظام، والمساحة تحت مؤشر الآيفون بلون الشريط السفلي */
  .safe-top { position:fixed; inset:0 0 auto 0; height:env(safe-area-inset-top); background:var(--top); }
  /* النظام ياخذ الشاشة لآخرها، والشريط السفلي مالته يترك مسافة مؤشر الآيفون بنفسه (نبلغه بيها) */
  #app { position:fixed; top:env(safe-area-inset-top); right:0; left:0; width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; background:var(--bottom); }
  #probe { position:fixed; visibility:hidden; pointer-events:none; height:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  /* الآيفون (التطبيق من الشاشة الرئيسية): الصفحة تنحسب أقصر من الشاشة بمقدار شريط الساعة فيبقى فراغ تحت.
     بهذي الحالة بس، السكربت يمدّ الصفحة لطول الشاشة الحقيقي وهذي القواعد تخلي العناصر تتبع الصفحة مو نافذة العرض القصيرة. */
  html.ext, html.ext body { position:relative; }
  html.ext .safe-top { position:absolute; }
  html.ext #app { position:absolute; }
  html.ext #splash { position:absolute; inset:0 0 auto 0; }
  #splash { position:fixed; inset:0; z-index:5; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
            background:var(--top); color:#fff; text-align:center; padding:24px; transition:opacity .35s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  #splash h1 { margin:6px 0 0; font-size:20px; font-weight:700; }
  #splash p { margin:0; font-size:14px; opacity:.8; }
  .spin { width:26px; height:26px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:r 1s linear infinite; margin-top:8px; }
  @keyframes r { to { transform:rotate(360deg); } }
  .msg { display:none; flex-direction:column; align-items:center; gap:12px; max-width:300px; }
  .msg.on { display:flex; }
  .btn { display:inline-block; border:0; border-radius:12px; padding:12px 20px; font:inherit; font-size:15px; font-weight:600;
         background:#fff; color:var(--top); text-decoration:none; cursor:pointer; }
  .btn.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); }
</style>
</head>
<body>
<div class="safe-top"></div>
<div id="probe"></div>
<div id="splash">
  <img src="icon-192.png" alt="">
  <h1>آليات المكتب الخاص</h1>
  <div class="spin" id="spin"></div>
  <div class="msg" id="offline">
    <p>ماكو اتصال بالإنترنت. أول ما يرجع الاتصال يفتح النظام تلقائياً.</p>
    <button class="btn" type="button" data-retry>إعادة المحاولة</button>
  </div>
  <div class="msg" id="slow">
    <p>النظام ياخذ وقت حتى يفتح.</p>
    <button class="btn" type="button" data-retry>إعادة المحاولة</button>
    <a class="btn ghost" id="direct" target="_blank" rel="noopener">افتحه بالمتصفح</a>
  </div>
</div>
<iframe id="app" title="آليات المكتب الخاص" allow="clipboard-write; fullscreen"></iframe>
<script>
  // رابط النظام (Apps Script). إذا تغيّر الرابط بدّله هنا بس.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwqNqHs7Ho9Hz5OKQEDDKHYJAGLlm5hIbMj1LCeh1HLewwOaDU2RooCkMWrb-Mxbuk88A/exec';

  const frame = document.getElementById('app'), splash = document.getElementById('splash');
  const show = id => { document.getElementById('spin').style.display = id ? 'none' : '';
    ['offline', 'slow'].forEach(x => document.getElementById(x).classList.toggle('on', x === id)); };
  document.getElementById('direct').href = APP_URL;
  let timer = null, loaded = false;

  function load() {
    loaded = false; splash.classList.remove('hide'); show(null);
    if (!navigator.onLine) { show('offline'); return; }
    clearTimeout(timer);
    timer = setTimeout(() => { if (!loaded) show('slow'); }, 20000);
    frame.src = APP_URL;
  }
  frame.addEventListener('load', () => {
    if (!frame.src) return;
    loaded = true; clearTimeout(timer);
    setTimeout(() => splash.classList.add('hide'), 250);
  });
  // الآيفون، التطبيق المثبّت على الشاشة الرئيسية: المتصفح يحسب ارتفاع الصفحة أقصر من الشاشة بمقدار شريط الساعة بالضبط،
  // فالنظام يخلص قبل آخر الشاشة ويبقى فراغ جوه الشريط السفلي. إذا لقينا هذا الفرق بالضبط نمدّ الصفحة والنظام لآخر الشاشة.
  // بأي حالة ثانية (أندرويد، حاسبة، متصفح عادي، أو آيفون يحسبها صح) ما نغيّر شي ويبقى التنسيق الأساسي.
  const root = document.documentElement, probe = document.getElementById('probe'), safeTop = document.querySelector('.safe-top');
  const insets = () => { const cs = getComputedStyle(probe); return { top: Math.round(parseFloat(cs.paddingTop) || 0), bottom: Math.round(parseFloat(cs.paddingBottom) || 0) }; };
  let ext = false;
  function fit() {
    let on = false, S = 0, top = 0;
    try {
      const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      const ih = window.innerHeight, iw = window.innerWidth;
      top = insets().top;
      S = ih >= iw ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      const short = S - ih;
      on = standalone && top > 0 && S > 0 && (Math.abs(short - top) <= 2 || (ext && Math.abs(short) <= 2));
    } catch (e) { on = false; }
    ext = on;
    root.classList.toggle('ext', on);
    const px = v => on ? v + 'px' : '';
    root.style.height = px(S); document.body.style.height = px(S); splash.style.height = px(S);
    safeTop.style.height = px(top); frame.style.top = px(top); frame.style.height = px(S - top);
  }
  fit();
  ['resize', 'orientationchange', 'pageshow'].forEach(ev => window.addEventListener(ev, () => { fit(); setTimeout(fit, 350); }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });

  document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', load));
  window.addEventListener('online', () => { if (!loaded) load(); });

  // نسخة احتياطية من جلسة الدخول: النظام يحفظها هنا، ويرجعها إذا انمسحت ذاكرته، فما يطلب تسجيل دخول.
  // ما نجاوب إلا النظام اللي داخل هذا التطبيق نفسه.
  const TOKEN_KEY = 'aliyat_token';
  const fromApp = e => { let w = e.source; for (let i = 0; i < 8 && w; i++) { if (w === frame.contentWindow) return true; if (w === w.parent) break; w = w.parent; } return false; };
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.aliyat !== 1 || !fromApp(e) || !/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin)) return;
    try {
      if (d.type === 'set-token' && typeof d.token === 'string' && d.token.length < 200) localStorage.setItem(TOKEN_KEY, d.token);
      else if (d.type === 'del-token') localStorage.removeItem(TOKEN_KEY);
      else if (d.type === 'get-token') e.source.postMessage({ aliyat: 1, type: 'token', token: localStorage.getItem(TOKEN_KEY) }, e.origin);
      // معرف الجهاز (يبقى حتى بعد تسجيل الخروج): يخلي الخادم يميز جهاز صاحب الحساب عند حد محاولات الدخول
      else if (d.type === 'set-dev' && typeof d.dev === 'string' && /^[0-9a-f]{20,64}$/.test(d.dev)) localStorage.setItem('aliyat_dev', d.dev);
      else if (d.type === 'get-dev') e.source.postMessage({ aliyat: 1, type: 'dev', dev: localStorage.getItem('aliyat_dev') }, e.origin);
      else if (d.type === 'get-inset') e.source.postMessage({ aliyat: 1, type: 'inset', bottom: insets().bottom }, e.origin);
    } catch (x) {}
  });

  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
